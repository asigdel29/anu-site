<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anu sigdel · building @ lora</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="light-theme">
    <div class="loading-screen">
      <p class="loading-text">hey, give the petals a second</p>
      <button class="loading-screen-button" disabled>loading...</button>
      <button class="no-sound-button" hidden>enter without sound</button>

      <p class="desktop-instructions instructions">drag to spin the island, scroll to zoom, click things</p>
      <p class="mobile-instructions instructions">drag to spin, pinch to zoom, tap twice to open things</p>
    </div>

    <div class="object-label" aria-hidden="true"></div>
    <div class="overlay"></div>

    <button type="button" class="mute-toggle-button toggle-buttons" inert aria-label="mute sound" aria-pressed="false">
      <svg class="sound-svg sound-on-svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
        <path d="M16 9a5 5 0 0 1 0 6" />
        <path d="M19.364 18.364a9 9 0 0 0 0-12.728" />
      </svg>
      <svg class="sound-svg sound-off-svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 4.702a.705.705 0 0 0-1.203-.498L6.413 7.587A1.4 1.4 0 0 1 5.416 8H3a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2.416a1.4 1.4 0 0 1 .997.413l3.383 3.384A.705.705 0 0 0 11 19.298z" />
        <line x1="22" x2="16" y1="9" y2="15" />
        <line x1="16" x2="22" y1="9" y2="15" />
      </svg>
    </button>

    <button type="button" class="theme-toggle-button toggle-buttons" inert aria-label="night mode" aria-pressed="false">
      <svg class="sun-svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2" />
        <path d="M12 20v2" />
        <path d="m4.93 4.93 1.41 1.41" />
        <path d="m17.66 17.66 1.41 1.41" />
        <path d="M2 12h2" />
        <path d="M20 12h2" />
        <path d="m6.34 17.66-1.41 1.41" />
        <path d="m19.07 4.93-1.41 1.41" />
      </svg>
      <svg class="moon-svg" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
      </svg>
    </button>

    <div class="work modal" role="dialog" aria-modal="true" aria-labelledby="work-title">
      <div class="modal-wrapper">
        <h2 class="modal-title" id="work-title">work</h2>
        <div class="modal-content"></div>
      </div>
      <button type="button" class="modal-exit-button" aria-label="close">
        <svg class="exit-button-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="about modal" role="dialog" aria-modal="true" aria-labelledby="about-title">
      <div class="modal-wrapper">
        <h2 class="modal-title" id="about-title">about</h2>
        <div class="modal-content"></div>
      </div>
      <button type="button" class="modal-exit-button" aria-label="close">
        <svg class="exit-button-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>

    <div class="contact modal" role="dialog" aria-modal="true" aria-labelledby="contact-title">
      <div class="modal-wrapper">
        <h2 class="modal-title" id="contact-title">say hey</h2>
        <div class="modal-content"></div>
      </div>
      <button type="button" class="modal-exit-button" aria-label="close">
        <svg class="exit-button-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </svg>
      </button>
    </div>


    <div id="experience" inert>
      <canvas
        id="experience-canvas"
        class="experience-canvas"
        role="img"
        aria-label="3d floating island with a cherry blossom tree; use the navigation at the top for the same content"
      ></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
